<div class="page-head">
  <div class="wrap">
    <p class="eyebrow">Contact</p>
    <h1>Call to schedule your first visit</h1>
  </div>
</div>

<section class="wrap contact-grid">
  <div class="card">
    <h2 class="card-h">Appointments</h2>
    <p class="big-phone"><a href="tel:{{site.phoneE164}}" data-call>{{site.phone}}</a></p>
    <div class="cta-buttons">{{bookButtons}}</div>
    <h2 class="card-h">Find us</h2>
    <p><a href="{{site.mapsUrl}}" rel="noopener" target="_blank">{{site.address.street}}<br>{{site.address.city}}, {{site.address.state}} {{site.address.zip}}</a></p>
    <p><a class="text-link" href="{{site.mapsUrl}}" rel="noopener" target="_blank">Get directions →</a></p>
    {{social}}
  </div>
  <div class="card">
    <h2 class="card-h">Hours</h2>
    {{hours}}
  </div>
</section>

<section class="wrap section">
  {{mapEmbed}}
</section>
